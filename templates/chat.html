<!DOCTYPE html>
<html>
    <head>
        <title>Medical Chatbot</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
    </head>
    
    
    <body>
        <div class="container-fluid h-100">
            <div class="row justify-content-center h-100">      
                <div class="col-12 chat"> <div class="card">
                        <div class="card-header msg_head">
                            <div class="d-flex bd-highlight">
                                <div class="img_cont">
                                    <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img" alt="Chatbot Avatar">
                                </div>
                                <div class="user_info">
                                    <span>Medical Chatbot</span>
                                    <p>Ask me anything!</p>
                                </div>
                            </div>
                        </div>
                        <div id="messageFormeight" class="card-body msg_card_body">
                            <div class="d-flex justify-content-start mb-4">
                                <div class="img_cont_msg">
                                    <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot Avatar">
                                </div>
                                <div class="msg_cotainer">
                                    Hello! I'm here to help with any medical questions you may have. What would you like to know?
                                 
                                </div>
                            </div>
                            
                        </div>
                        <div class="card-footer">
                            <form id="messageArea" class="input-group">
                                <input type="text" id="text" name="msg" placeholder="Type your message..." autocomplete="off" class="form-control type_msg" required/>
                                <button type="submit" id="send" class="send_btn"><i class="fas fa-paper-plane"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script>
            $(document).ready(function() {
                // Scroll to the bottom on load/initial content
                $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);

                $("#messageArea").on("submit", function(event) {
                    event.preventDefault(); // Prevent default form submission
                    
                    const date = new Date();
                    const hour = date.getHours();
                    const minute = date.getMinutes().toString().padStart(2, '0'); // Add leading zero
                    const str_time = hour+":"+minute;
                    var rawText = $("#text").val().trim(); // Use trim() to clean input
                    
                    if (rawText === "") {
                        return; // Don't send empty messages
                    }

                    // User Message HTML (Sent)
                    var userHtml = '<div class="d-flex justify-content-end mb-4"><div class="msg_cotainer_send">' + rawText + '<span class="msg_time_send">'+ str_time + '</span></div><div class="img_cont_msg"><img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg" alt="User Avatar"></div></div>';
                    
                    $("#text").val("");
                    $("#messageFormeight").append(userHtml);
                    
                    // Scroll to bottom after user message
                    $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);


                    $.ajax({
                        data: {
                            msg: rawText,   
                        },
                        type: "POST",
                        url: "/get",
                    }).done(function(data) {
                        // Bot Message HTML (Received)
                        var botHtml = '<div class="d-flex justify-content-start mb-4"><div class="img_cont_msg"><img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" class="rounded-circle user_img_msg" alt="Bot Avatar"></div><div class="msg_cotainer">' + data + '<span class="msg_time">' + str_time + '</span></div></div>';
                        $("#messageFormeight").append($.parseHTML(botHtml));
                        
                        // Scroll to bottom after bot message
                        $('#messageFormeight').scrollTop($('#messageFormeight')[0].scrollHeight);
                    });
                });
            });
        </script>
		<div class="copyright-footer">
        <p>Copyright &copy; Kopila Devkota. All rights reserved. Made by Kopila Devkota.</p>
    </div>
        
  
        
    </body>
</html>
